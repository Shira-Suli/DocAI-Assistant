
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ask AI</title>

    <style>
      body {
        margin: 0;
        width: 360px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, sans-serif;
        background: #f4f6fb;
      }

      .container {
        background: #ffffff;
        border-radius: 14px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
        overflow: hidden;
      }

      .header {
        padding: 14px;
        text-align: center;
        font-weight: 600;
        font-size: 15px;
        color: white;
        background: linear-gradient(135deg, #6c7cff, #7f53ac);
      }

      .content {
        padding: 14px;
      }

      textarea {
        width: 100%;
        min-height: 80px;
        padding: 12px;
        font-size: 13px;
        border-radius: 12px;
        border: 1px solid #e5e7eb;
        resize: vertical;
        outline: none;
      }

      button {
        margin-top: 12px;
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        color: white;
        background: linear-gradient(135deg, #6c7cff, #7f53ac);
        cursor: pointer;
      }

      #preview {
        margin-top: 12px;
        padding: 10px;
        font-size: 12px;
        background: #f1f3f7;
        border-radius: 10px;
        max-height: 70px;
        overflow-y: auto;
        white-space: pre-wrap;
      }

      #clearBtn {
        margin-top: 6px;
        font-size: 12px;
        background: none;
        border: none;
        color: #6c7cff;
        cursor: pointer;
        text-align: left;
        padding: 0;
      }

      #answer {
        margin-top: 12px;
        font-size: 13px;
        line-height: 1.5;
        white-space: pre-wrap;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="header">✨ AI Assistant</div>

      <div class="content">
        <textarea
          id="question"
          placeholder="Ask a question about this page..."
        ></textarea>

        <button id="askBtn">Ask AI</button>

        <div id="preview"></div>
        <button id="clearBtn" style="display:none;">
          Clear selection
        </button>

        <div id="answer"></div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
